[workspace]
resolver = "2"
members = [
    "crates/docx-tree-core",
    "crates/docx-tree-wasm",
    "crates/docx-tree-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
miniz_oxide = "0.8"
quick-xml = { version = "0.38", default-features = false }

# 体积优先：全 workspace 统一 release 配置（见 design.md §3.5）
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "unwind"  # 配合 wasm 侧 catch_unwind，见 §3.4
strip = "symbols"
